name: Security, test and package
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 1'
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Audit the exact lockfile, including build-only dependencies, without
      # executing dependency lifecycle scripts. Registry errors also fail.
      - run: npm ci --ignore-scripts
      - run: npm run audit:security
  test:
    needs: security
    # Weekly runs only recheck advisories. Pushes, PRs and manual runs also
    # exercise both native CI platforms and packaging after the security gate.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-packages-${{ matrix.os }}
          path: |
            dist/v*/*.streamDeckPlugin
            dist/v*/SHA256SUMS.txt
          if-no-files-found: error
