name: Security, test and package
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 1'
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm run version:release
      # Audit the exact lockfile, including build-only dependencies, without
      # executing dependency lifecycle scripts. Registry errors also fail.
      - run: npm ci --ignore-scripts
      - run: npm run audit:security
  test:
    needs: security
    # Weekly runs only recheck advisories. Pushes, PRs and manual runs also
    # exercise both native CI platforms and packaging after the security gate.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-packages-${{ matrix.os }}
          path: |
            dist/v*/*.streamDeckPlugin
            dist/v*/SHA256SUMS.txt
          if-no-files-found: error
  required:
    name: Required checks
    needs: [security, test]
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require security and both platform jobs
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$SECURITY_RESULT" = success
          test "$TEST_RESULT" = success
